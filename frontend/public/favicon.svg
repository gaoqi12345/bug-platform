<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- 背景圆形 -->
  <circle cx="32" cy="32" r="32" fill="#3B82F6"/>

  <!-- 盾牌主体 -->
  <path d="M32 10 L50 18 L50 34 C50 44 42 52 32 56 C22 52 14 44 14 34 L14 18 Z"
        fill="white" fill-opacity="0.15" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Bug 身体（椭圆） -->
  <ellipse cx="32" cy="34" rx="9" ry="11" fill="white"/>

  <!-- Bug 头部 -->
  <circle cx="32" cy="22" r="5.5" fill="white"/>

  <!-- Bug 眼睛 -->
  <circle cx="29.5" cy="21.5" r="1.2" fill="#3B82F6"/>
  <circle cx="34.5" cy="21.5" r="1.2" fill="#3B82F6"/>

  <!-- Bug 身体分节线 -->
  <line x1="23" y1="32" x2="41" y2="32" stroke="#3B82F6" stroke-width="1.2" stroke-opacity="0.5"/>
  <line x1="23" y1="37" x2="41" y2="37" stroke="#3B82F6" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- 左侧触角 -->
  <path d="M28 17 Q24 11 20 10" stroke="white" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <circle cx="20" cy="10" r="1.5" fill="white"/>

  <!-- 右侧触角 -->
  <path d="M36 17 Q40 11 44 10" stroke="white" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <circle cx="44" cy="10" r="1.5" fill="white"/>

  <!-- 左侧腿（3条） -->
  <line x1="23" y1="28" x2="15" y2="25" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="23" y1="33" x2="14" y2="32" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="23" y1="38" x2="15" y2="41" stroke="white" stroke-width="1.8" stroke-linecap="round"/>

  <!-- 右侧腿（3条） -->
  <line x1="41" y1="28" x2="49" y2="25" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="41" y1="33" x2="50" y2="32" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="41" y1="38" x2="49" y2="41" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
</svg>
