[project]
name = "bug-platform-backend"
version = "1.0.0"
description = "Bug Platform — 缺陷管理平台后端（FastAPI + SQLAlchemy + PostgreSQL）"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "gunicorn==22.0.0",
    "sqlalchemy==2.0.30",
    "alembic==1.13.1",
    "psycopg2-binary==2.9.9",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-multipart==0.0.9",
    "minio==7.2.7",
    "httpx==0.27.0",
    # 飞书开放平台官方 SDK（WebSocket 长连接接收卡片回调，仅自建应用模式需要）
    "lark-oapi>=1.7.2,<2",
]

[dependency-groups]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
